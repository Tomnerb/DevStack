# Copy/merge this into .gitlab-ci.yml when you have shell runners
# tagged: linux, windows, macos.
#
# Native runners are recommended for final installers/signing even though
# Wails can cross-build many targets from another host.

stages:
  - build

variables:
  GIT_DEPTH: "0"

linux:
  stage: build
  tags: [linux]
  script:
    - go version
    - node --version
    - npm --version
    - wails3 doctor
    - cd frontend && npm ci && cd ..
    - go mod tidy
    - wails3 package GOOS=linux GOARCH=amd64 EXTRA_TAGS=gtk3
  artifacts:
    when: always
    paths:
      - bin/
      - build/linux/
    expire_in: 14 days

windows:
  stage: build
  tags: [windows]
  script:
    - go version
    - node --version
    - npm --version
    - wails3 doctor
    - cd frontend
    - npm ci
    - cd ..
    - go mod tidy
    - wails3 package GOOS=windows GOARCH=amd64
  artifacts:
    when: always
    paths:
      - bin/
      - build/windows/nsis/
    expire_in: 14 days

macos:
  stage: build
  tags: [macos]
  script:
    - go version
    - node --version
    - npm --version
    - xcode-select -p
    - wails3 doctor
    - cd frontend && npm ci && cd ..
    - go mod tidy
    - wails3 task darwin:package:universal
  artifacts:
    when: always
    paths:
      - bin/
    expire_in: 14 days
